<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Orphans in JS</title>
    <link rel="stylesheet" href="orphan_js.css" />
    <style>
      .list {
        display: grid;
      }
      .row {
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <ul class="list js-list"></ul>
    <script>
      const list = document.querySelector(".js-list");
      const card = document.createElement("div");
      card.className = "card ghost-panel";
      card.classList.add("is-zz");
      card.classList.toggle("is-open", true);
      function renderRow(on) {
        return `<li class="row ${on ? "row-on" : ""}">x</li>`;
      }
      list.innerHTML = '<span class="badge-q">new</span>' + renderRow(true);
      card.innerHTML = `<i class="${on ? "nest-on" : ""}" title="${on}">i</i>`;
      list.insertAdjacentHTML("beforeend", "<b class=\"esc-cls\">e</b>");
    </script>
  </body>
</html>
